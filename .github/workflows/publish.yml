name: Publish Nymind LIVE
on:
  push:
    branches: [main]
    paths:
      - package.json
      - app/tv09.html
      - .github/workflows/publish.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nymind-live-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate IPTV wrapper syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          h=pathlib.Path('app/tv09.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>',h,re.S|re.I)
          assert len(scripts)==1, f'Expected single wrapper script, found {len(scripts)}'
          assert 'var inject=' in scripts[0]
          assert '<\\/script>' in scripts[0]
          pathlib.Path('/tmp/nymind-iptv-wrapper.js').write_text(scripts[0])
          PY
          node --check /tmp/nymind-iptv-wrapper.js
      - name: Publish tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Nymind LIVE ${TAG}"
            git push origin "${TAG}"
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "Nymind LIVE ${TAG}" --notes "RED = Nymind Home; player, EPG and playlists preserved."
          fi
      - name: Purge jsDelivr manifests and IPTV entrypoint
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for REV in '' '@main' '@latest' "@v${VERSION}"; do
            for FILE in package.json app/tv09.html; do
              curl --max-time 15 -fsSL "https://purge.jsdelivr.net/gh/romangazdik-web/tvpin${REV}/${FILE}" || echo "Purge may be rate-limited"
            done
          done
